parameters:
- name: stable
  type: boolean
  default: false

jobs:
- job: BuildAndTest
  displayName: Build and Test
  pool:
    vmImage: windows-2022
  steps:
  - task: UseDotNet@2
    displayName: 'Use .NET SDK 6.0.317'
    inputs:
      packageType: 'sdk'
      version: '6.0.317'

  - task: UseDotNet@2
    displayName: 'Use .NET SDK 8.0.408'
    inputs:
      packageType: 'sdk'
      version: '8.0.408'

  - task: PowerShell@2
    displayName: Get Version from Directory.Build.props
    inputs:
      targetType: inline
      script: |
        $versionSuffix = "-$(Build.BuildNumber)"
        if ("$(Build.SourceBranch)" -eq "refs/heads/main") {
          $versionSuffix = ""
        }

        $stable = "${{ parameters.stable }}" -eq "True"
        if ($stable) {
          # Repeats ApproveStableRelease in azure-pipelines.yaml.
          if ("$(Build.SourceBranch)" -notlike "refs/heads/release/*") {
            Write-Host "##vso[task.logissue type=error]A stable release can be built only from release/*, not $(Build.SourceBranch)."
            exit 1
          }
          $versionSuffix = ""
        }

        $xml = [Xml] (Get-Content .\src\Directory.Build.props)

        $version = [String] $xml.Project.PropertyGroup.Version
        $version = $version.Trim()
        $fullVersion = "$version$versionSuffix"

        if ($stable) {
          Write-Host "##vso[build.addbuildtag]stable-$fullVersion"
        }
        Write-Host "##vso[task.setvariable variable=Version;]$fullVersion"
        Write-Host "Version that will be used is $fullVersion"

  - task: DotNetCoreCLI@2
    displayName: dotnet test
    inputs:
      command: test
      projects: src
      arguments: --configuration $(BuildConfiguration) --collect "Code Coverage" --settings src/CodeCoverage.runsettings /p:Version="$(Version)"

  - task: CopyFiles@2
    displayName: 'Copy Files to: Build.ArtifactStagingDirectory'
    inputs:
      SourceFolder: src
      Contents: |
        UiPath.Workflow.Runtime\bin\$(BuildConfiguration)\*.*nupkg
        UiPath.Workflow\bin\$(BuildConfiguration)\*.*nupkg
      TargetFolder: $(Build.ArtifactStagingDirectory)
      CleanTargetFolder: true
      flattenFolders: true

  - task: PublishBuildArtifacts@1
    displayName: Publish Artifacts
    inputs:
      ArtifactName: $(ArtifactName)