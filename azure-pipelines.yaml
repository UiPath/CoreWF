trigger:
  branches:
    include:
    - main
    - develop
    - support/*
    - release/*
pr:
  branches:
    include:
    - develop

name: $(Date:yyyyMMdd)$(Rev:-rr)

# Manual runs on release/* branches only: builds UiPath.Workflow and UiPath.Workflow.Runtime as a stable
# release (the Version from src/Directory.Build.props without the -<build number> suffix), which
# ReleaseInternal pushes to UiPath-Internal. The run first waits for an approval on the CoreWFStableRelease
# environment (ApproveStableRelease below). One stable per Version: a second run with the same Version fails
# on push, so bump Version on develop after each stable release.
parameters:
- name: stable
  displayName: 'Build and publish a stable release (release/* only)'
  type: boolean
  default: false

resources:
  repositories:
    - repository: templates
      type: github
      name: UiPath/AzurePipelinesTemplates
      ref: refs/tags/uipath.package-signing.2.0.6
      endpoint: UiPath

variables:
- template: .pipelines/vars.yml

stages:
# Stable release. BuildAndTest, and through it both release stages, waits for this one, so nothing is built
# until the run is approved on the CoreWFStableRelease environment. The job that asks for the approval exists
# only on release/*; on any other branch the stage fails here instead.
- ${{ if eq(parameters.stable, true) }}:
  - stage: ApproveStableRelease
    displayName: Approve stable release
    dependsOn: []
    jobs:
    - ${{ if startsWith(variables['Build.SourceBranch'], 'refs/heads/release/') }}:
      - deployment: ApproveStableRelease
        displayName: Approve stable release
        environment: 'CoreWFStableRelease'
        pool:
          vmImage: ubuntu-latest
        strategy:
          runOnce:
            deploy:
              steps:
              - download: none
              - bash: echo "Stable release approved for $(Build.SourceBranch)."
                displayName: Record the approval
    - ${{ else }}:
      - job: RejectStableRelease
        displayName: Reject stable release
        pool:
          vmImage: ubuntu-latest
        steps:
        - checkout: none
        - bash: |
            echo "##vso[task.logissue type=error]A stable release can be built only from release/*, not $(Build.SourceBranch)."
            exit 1
          displayName: Check the branch

- stage: BuildAndTest
  ${{ if eq(parameters.stable, true) }}:
    dependsOn: [ ApproveStableRelease ]
  jobs:
  - template: .pipelines/build.yaml
    parameters:
      stable: ${{ parameters.stable }}

- stage: ReleaseInternal
  condition: and(succeeded(), or(eq(variables['Build.SourceBranch'], 'refs/heads/develop'), startsWith(variables['Build.SourceBranch'], 'refs/heads/support/'), startsWith(variables['Build.SourceBranch'], 'refs/heads/release/')))
  dependsOn: BuildAndTest
  jobs:
  - template: .pipelines/release.yaml
    parameters:
      type: internal

- stage: ReleasePublic
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
  dependsOn: BuildAndTest
  jobs:
  - template: .pipelines/release.yaml
    parameters:
      type: public
