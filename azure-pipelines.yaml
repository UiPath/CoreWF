trigger:
  branches:
    include:
    - main
    - develop
    - support/*
    - release/*
pr:
  branches:
    include:
    - develop

name: $(Date:yyyyMMdd)$(Rev:-rr)

# Manual develop runs only: builds UiPath.Workflow and UiPath.Workflow.Runtime as a stable release (the
# Version from src/Directory.Build.props without the -<build number> suffix), which ReleaseInternal pushes
# to UiPath-Internal. Bump Version after each stable release: a second run with the same Version fails
# on push.
parameters:
- name: stable
  displayName: 'Build a stable release (develop only)'
  type: boolean
  default: false

resources:
  repositories:
    - repository: templates
      type: github
      name: UiPath/AzurePipelinesTemplates
      ref: refs/tags/uipath.package-signing.2.0.6
      endpoint: UiPath

variables:
- template: .pipelines/vars.yml

stages:
- stage: BuildAndTest
  jobs:
  - template: .pipelines/build.yaml
    parameters:
      stable: ${{ parameters.stable }}

- stage: ReleaseInternal
  condition: and(succeeded(), or(eq(variables['Build.SourceBranch'], 'refs/heads/develop'), startsWith(variables['Build.SourceBranch'], 'refs/heads/support/'), startsWith(variables['Build.SourceBranch'], 'refs/heads/release/')))
  dependsOn: BuildAndTest
  jobs:
  - template: .pipelines/release.yaml
    parameters:
      type: internal

- stage: ReleasePublic
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
  dependsOn: BuildAndTest
  jobs:
  - template: .pipelines/release.yaml
    parameters:
      type: public
